<div class="col-lg-12">
    <div class="sidebar-item recent-posts">
        <div class="sidebar-heading">
            <h2>Recent Posts</h2>
        </div>
        <div class="content">
            <ul>
                <li>
                    {% for article in global_recent_articles %}
                        <a href="{% url 'article detail' article.slug %}">
                            <h5>{{ article.title }}</h5>
                            <span>{{ article.created_at|date:"M d, Y" }}</span>
                            <br>
                        </a>
                    {% endfor %}
                </li>
            </ul>
        </div>
    </div>
</div>
