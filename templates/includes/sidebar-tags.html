<div class="col-lg-12">
    <div class="sidebar-item tags">
        <div class="sidebar-heading">
            <h2>Tag Clouds</h2>
        </div>
        <div class="content">
            <ul>
                {% for tag in global_tags %}
                    <li><a href="?tag={{ tag.slug }}">{{ tag.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
