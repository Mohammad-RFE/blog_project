<div class="col-lg-12">
    <div class="sidebar-item categories">
        <div class="sidebar-heading">
            <h2>Categories</h2>
        </div>
        <div class="content">
            <ul>
                {% for category in global_categories %}
                    <li><a href="?category={{ category.slug }}">-{{ category.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
